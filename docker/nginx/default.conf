server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ApiConfig() returns an empty base URL for non-CF hosts. Keep the UI
    # source unchanged by proxying its same-origin API calls to trader-app.
    location /query/ {
        proxy_pass http://trader-app:8080/query/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /command/ {
        proxy_pass http://trader-app:8080/command/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
