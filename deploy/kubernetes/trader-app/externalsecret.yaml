# Credentials for trader-app, synced from Secret Manager by External Secrets through the per-workload SecretStore
# gcp-sm-trader-app (infra/k8s/platform/stores.yaml). The Secret Manager secrets are declared in
# infra/terraform/modules/foundation (values added out of band); nothing secret is stored in the repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trader-app-secrets
  labels:
    app.kubernetes.io/name: trader-app
    app.kubernetes.io/part-of: axon-trader
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm-trader-app
  target:
    name: trader-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: trader-app-db-password
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteRef:
        key: rabbitmq-password
