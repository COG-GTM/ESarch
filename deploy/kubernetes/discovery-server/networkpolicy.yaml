# infra/k8s/platform/networkpolicy.yaml denies all ingress by default. Axon routing needs two flows:
#   - both apps -> discovery-server:8761 (Eureka register, heartbeat, registry fetch)
#   - app pod -> app pod on 8080: the DistributedCommandBus posts each command to the pod the consistent-hash ring
#     picked (SpringHttpCommandBusConnector, /spring-command-bus-connector/command), straight to its pod IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-server-from-axon-apps
  labels:
    app.kubernetes.io/part-of: axon-trader
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [trader-app, trading-engine]}
      ports:
        - port: 8761
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: axon-command-bus
  labels:
    app.kubernetes.io/part-of: axon-trader
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [trader-app, trading-engine]}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [trader-app, trading-engine]}
      ports:
        - port: 8080
          protocol: TCP
