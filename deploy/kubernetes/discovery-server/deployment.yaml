# In-cluster Eureka (discovery-server) for Axon command routing; replaces the TAS Service Registry (p-service-registry).
# Single replica on purpose: a second, unpeered Eureka would split the registry. While it restarts (Recreate) the apps
# keep routing on their cached registry and re-register on their next heartbeat. See README.md (Command routing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: axon-trader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/part-of: axon-trader
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discovery-server
          # The Helm chart (s3.5) sets the Artifact Registry path and git-SHA tag.
          image: esarch/discovery-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
          ports:
            - name: http
              containerPort: 8761
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
