apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axon-trader.uiName" . }}
  labels:
    {{- include "axon-trader.labels" . | nindent 4 }}
    app.kubernetes.io/name: trader-app-ui
spec:
  replicas: {{ .Values.replicaCount.ui }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trader-app-ui
      {{- include "axon-trader.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trader-app-ui
        {{- include "axon-trader.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: trader-app-ui
          image: "{{ .Values.images.ui.repository }}:{{ .Values.images.ui.tag }}"
          imagePullPolicy: {{ .Values.images.ui.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.uiResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axon-trader.uiName" . }}
  labels:
    {{- include "axon-trader.labels" . | nindent 4 }}
    app.kubernetes.io/name: trader-app-ui
spec:
  selector:
    app.kubernetes.io/name: trader-app-ui
    {{- include "axon-trader.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
