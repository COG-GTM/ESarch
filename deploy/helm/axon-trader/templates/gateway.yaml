{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "axon-trader.labels" . | nindent 4 }}
  {{- with .Values.gateway.certificateMap }}
  annotations:
    # Certificate Manager map with the Google-managed certificate (Terraform gke-platform module).
    networking.gke.io/certmap: {{ . | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- with .Values.gateway.addressName }}
  addresses:
    - type: NamedAddress
      value: {{ . | quote }}
  {{- end }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .port }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
