{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "axon-trader.labels" . | nindent 4 }}
  {{- with .Values.gateway.certificateMap }}
  annotations:
    # Certificate Manager map with the Google-managed certificate (Terraform gke-platform module).
    networking.gke.io/certmap: {{ . | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- with .Values.gateway.addressName }}
  addresses:
    - type: NamedAddress
      value: {{ . | quote }}
  {{- end }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .port }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
{{- if and .Values.gateway.create .Values.gateway.httpsRedirect }}
{{- $listeners := .Values.gateway.listeners }}
{{- $hasHttps := false }}
{{- range $listeners }}{{ if eq .protocol "HTTPS" }}{{ $hasHttps = true }}{{ end }}{{ end }}
{{- if $hasHttps }}
{{- range $listeners }}
{{- if eq .protocol "HTTP" }}
---
# Plain HTTP only redirects to HTTPS (same as http-to-https in infra/k8s/platform/gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.gateway.name }}-{{ .name }}-to-https
  labels:
    {{- include "axon-trader.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      sectionName: {{ .name }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
{{- end }}
{{- end }}
