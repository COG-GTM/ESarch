apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axon-trader.traderAppName" . }}
  labels:
    {{- include "axon-trader.labels" . | nindent 4 }}
    app.kubernetes.io/name: trader-app
spec:
  replicas: {{ .Values.replicaCount.traderApp }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trader-app
      {{- include "axon-trader.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trader-app
        {{- include "axon-trader.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: trader-app
          image: "{{ .Values.images.traderApp.repository }}:{{ .Values.images.traderApp.tag }}"
          imagePullPolicy: {{ .Values.images.traderApp.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_APPLICATION_NAME
              value: trader-app
            {{- include "axon-trader.backendEnv" . | nindent 12 }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ .Values.mysql.host }}:{{ .Values.mysql.port }}/{{ .Values.database.appDatabase }}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: axon-trader-credentials
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: axon-trader-credentials
                  key: db-password
            - name: SERVER_PORT
              value: "8080"
          volumeMounts:
            - name: app-config
              mountPath: /config/application-cloud.yml
              subPath: trader-app-application-cloud.yml
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.cloudSqlProxy.image }}
          args:
            - "--structured-logs"
            - "--port=3306"
            - {{ .Values.cloudSqlProxy.instanceConnectionName | quote }}
          securityContext:
            runAsNonRoot: true
        {{- end }}
      volumes:
        - name: app-config
          configMap:
            name: axon-trader-config
      {{- if .Values.cloudSqlProxy.enabled }}
      serviceAccountName: {{ .Values.cloudSqlProxy.serviceAccountName }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axon-trader.traderAppName" . }}
  labels:
    {{- include "axon-trader.labels" . | nindent 4 }}
    app.kubernetes.io/name: trader-app
spec:
  selector:
    app.kubernetes.io/name: trader-app
    {{- include "axon-trader.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
