# Local stand-in for overlays/staging on kind (no GCP), driven by scripts/kind-check.sh:
# the same RabbitMQ and debug-Job components, a MySQL 8.0 stand-in for Cloud SQL, and a fake
# gcp-sm-trading-engine SecretStore created by the script with generated passwords.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: axon-trader
resources:
  - namespace.yaml
  - mysql-standin.yaml
components:
  - ../../components/rabbitmq
  - ../../components/backing-services-check
patches:
  # No Cloud SQL Auth Proxy: connect straight to the stand-in.
  - target: {kind: Job, name: backing-services-check}
    patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: mysql-standin.axon-trader.svc.cluster.local
