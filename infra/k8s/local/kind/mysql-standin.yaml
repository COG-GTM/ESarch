# MySQL 8.0 standing in for Cloud SQL: same databases and users as modules/backing-services.
# The mysql-standin Secret (root-password, init.sql) is generated by scripts/kind-check.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-standin
  namespace: axon-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-standin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-standin
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.46
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-standin
                  key: root-password
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -u root -e "SELECT 1"']
            periodSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: init
          secret:
            secretName: mysql-standin
            items:
              - key: init.sql
                path: init.sql
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-standin
  namespace: axon-trader
spec:
  selector:
    app.kubernetes.io/name: mysql-standin
  ports:
    - port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-standin
  namespace: axon-trader
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql-standin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 3306
