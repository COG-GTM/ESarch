# kubectl apply --server-side -k infra/k8s/overlays/prod  (after scripts/cluster-env.sh prod)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform
  - rabbitmq-pdb.yaml
components:
  - ../../components/rabbitmq
  - ../../components/cluster-env
patches:
  # 3-node RabbitMQ (quorum queues survive the loss of one node), one node per zone.
  - target: {kind: RabbitmqCluster, name: rabbitmq}
    patch: |-
      apiVersion: rabbitmq.com/v1beta1
      kind: RabbitmqCluster
      metadata:
        name: rabbitmq
      spec:
        replicas: 3
        persistence:
          storage: 50Gi
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 2Gi
        override:
          statefulSet:
            spec:
              template:
                spec:
                  containers: []
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: topology.kubernetes.io/zone
                      whenUnsatisfiable: DoNotSchedule
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: rabbitmq
configMapGenerator:
  - name: cluster-env
    namespace: axon-trader
    envs:
      - cluster.env
    options:
      disableNameSuffixHash: true
      annotations:
        # Source of the replacements only; not applied to the cluster.
        config.kubernetes.io/local-config: "true"
