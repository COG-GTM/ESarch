apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: axon-trader
  labels:
    app.kubernetes.io/name: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: axon-trader
spec:
  selector:
    app.kubernetes.io/name: hello-world
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-world
  namespace: axon-trader
spec:
  parentRefs:
    - name: axon-trader
      sectionName: https
  hostnames:
    - SMOKE_HOSTNAME
  rules:
    - backendRefs:
        - name: hello-world
          port: 8080
---
# Google Front End and health-check ranges of the external Application Load Balancer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hello-world-from-load-balancer
  namespace: axon-trader
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - port: 8080
          protocol: TCP
