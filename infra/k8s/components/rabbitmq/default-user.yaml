# The broker's default (application) user comes from Secret Manager, so Secret Manager is the
# single source of truth for the credentials p3 consumes:
#   user axon-trader, password secret `rabbitmq-password` (generated by Terraform,
#   modules/backing-services; readable by the trader-app and trading-engine GSAs).
# Check: kubectl -n axon-trader get externalsecret rabbitmq-default-user  (STATUS SecretSynced)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-default-user
  namespace: axon-trader
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm-trading-engine
  target:
    name: rabbitmq-default-user-external
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: axon-trader
        password: "{{ .password }}"
        host: rabbitmq.axon-trader.svc.cluster.local
        port: "5672"
        # Read by the broker at boot (RabbitmqCluster spec.secretBackend.externalSecret).
        default_user.conf: |
          default_user = axon-trader
          default_pass = {{ .password }}
  data:
    - secretKey: password
      remoteRef:
        key: rabbitmq-password
