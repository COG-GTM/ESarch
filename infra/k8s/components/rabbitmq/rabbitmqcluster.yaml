# AMQP endpoint for the apps: rabbitmq.axon-trader.svc.cluster.local:5672, vhost /.
# Check: kubectl -n axon-trader get rabbitmqcluster rabbitmq  (ALLREPLICASREADY True)
# The operator enables rabbitmq_prometheus (:15692) and labels the pods
# app.kubernetes.io/component=rabbitmq, which the PodMonitoring in platform/monitoring.yaml selects.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: axon-trader
spec:
  replicas: 1
  image: rabbitmq:4.2.9-management
  service:
    type: ClusterIP
  persistence:
    # Cluster default StorageClass (GKE: standard-rwo, Persistent Disk CSI).
    storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  secretBackend:
    externalSecret:
      name: rabbitmq-default-user-external
  rabbitmq:
    additionalConfig: |
      vm_memory_high_watermark.relative = 0.6
      disk_free_limit.absolute = 1GB
  # Pod Security Standard `restricted` (namespace enforce label in platform/namespace.yaml): the operator's
  # default pod runs as uid 999 but sets neither seccomp nor allowPrivilegeEscalation/capabilities.
  override:
    statefulSet:
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 999
              fsGroup: 999
              seccompProfile:
                type: RuntimeDefault
            initContainers:
              - name: setup-container
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
            containers:
              - name: rabbitmq
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
