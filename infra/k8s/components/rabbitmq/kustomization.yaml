# Replaces the TAS `rabbit` service (CloudAMQP / p.rabbitmq): a RabbitmqCluster managed by the
# RabbitMQ Cluster Operator (addons/rabbitmq-operator). One node here; overlays/prod scales to 3.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - default-user.yaml
  - rabbitmqcluster.yaml
  - networkpolicy.yaml
