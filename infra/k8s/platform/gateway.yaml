# Global external Application Load Balancer. TLS uses the Google-managed certificate in the
# Certificate Manager map from Terraform (modules/gke-platform); the IP is the reserved global address.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: axon-trader
  annotations:
    networking.gke.io/certmap: CERT_MAP_NAME
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: GATEWAY_ADDRESS_NAME
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
spec:
  parentRefs:
    - name: axon-trader
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
