# Workload KSAs bound to the foundation GSAs (<env>-trader-app, <env>-trading-engine) through
# GKE Workload Identity. The IAM side is enable_gke_workload_identity_bindings in Terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trader-app
  annotations:
    iam.gke.io/gcp-service-account: TRADER_APP_GSA
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-engine
  annotations:
    iam.gke.io/gcp-service-account: TRADING_ENGINE_GSA
