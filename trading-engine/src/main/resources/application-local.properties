# Off-TAS local profile (SPRING_PROFILES_ACTIVE=local), backed by docker-compose.yml.
# Mirrors what ESarch-conf's trading-engine-cloud.yml sets on TAS, with the bound services pointed at localhost.
server.port=${PORT:8081}
# The local profile has no auth in front of the trading API, so only listen on loopback and advertise loopback in Eureka.
server.address=${ESARCH_BIND_ADDRESS:127.0.0.1}
eureka.instance.hostname=${ESARCH_BIND_ADDRESS:127.0.0.1}
eureka.instance.ip-address=${ESARCH_BIND_ADDRESS:127.0.0.1}
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://${ESARCH_MYSQL_HOST:localhost}:${ESARCH_MYSQL_PORT:3306}/enginedb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${ESARCH_MYSQL_USER:trader}
spring.datasource.password=${ESARCH_MYSQL_PASSWORD:trader}
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.use-new-id-generator-mappings=true
spring.jpa.show-sql=false

spring.rabbitmq.host=${ESARCH_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${ESARCH_RABBITMQ_USER:trader}
spring.rabbitmq.password=${ESARCH_RABBITMQ_PASSWORD:trader}

eureka.client.serviceUrl.defaultZone=${ESARCH_EUREKA_URL:http://localhost:8761/eureka/}
# Pick up the other app within seconds of it starting, instead of Eureka's 30s default.
eureka.client.registryFetchIntervalSeconds=5

management.cloudfoundry.enabled=false
