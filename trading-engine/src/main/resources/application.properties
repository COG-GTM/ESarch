#spring.h2.console.enabled=true
#spring.main.banner-mode=off
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL55Dialect
#
management.endpoints.enabled-by-default=true
# Only what the probes, scrapers and smoke checks call (s5.4); never env, beans, heapdump, etc.
management.endpoints.web.exposure.include=health,info,prometheus

axon.distributed.enabled=true
axon.distributed.spring-cloud.fallback-to-http-get=false

axon.amqp.exchange=trading-engine-events
axon.amqp.transaction-mode=publisher_ack

axon.serializer.events=jackson

# Open Session In View in combination with Server Sent Events is connection trouble waiting to happen
spring.jpa.open-in-view=false

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it, so a restart
# never drops data. Only the `local` profile lets Hibernate recreate the schema.
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
