# Kubernetes / GKE profile (SPRING_PROFILES_ACTIVE=kubernetes). Replaces the TAS Config Server `cloud` profile
# (ESarch-conf trader-app/trader-app-cloud.yml), whose values are vendored below. See docs/migration/tas-gke-mapping.md (CHG-4..CHG-9).
#
# Connection settings come only from environment variables and have no defaults, so a missing variable fails startup
# instead of silently falling back to H2:
#   ConfigMap trader-app-config:   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_RABBITMQ_HOST, SPRING_RABBITMQ_PORT,
#                                SPRING_RABBITMQ_USERNAME, SPRING_RABBITMQ_VIRTUAL_HOST, EUREKA_DEFAULT_ZONE
#   Secret trader-app-secrets (ExternalSecret from Secret Manager): SPRING_DATASOURCE_PASSWORD, SPRING_RABBITMQ_PASSWORD
# Any other property can be overridden from the ConfigMap through relaxed binding (e.g. LOGGING_LEVEL_COM_ZAXXER_HIKARI).
# See deploy/kubernetes/README.md.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=30000

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}

# Flyway owns the schema (db/migration); Hibernate validates it on start, so a pod restart never drops data.
# baseline-on-migrate lets a database imported from TAS (tables present, no flyway_schema_history) start at V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.use-new-id-generator-mappings=true
spring.jpa.show-sql=false

logging.level.org.axonframework=INFO
logging.level.io.pivotal.refarch=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.com.zaxxer.hikari=DEBUG

# Axon command routing still uses Eureka until s3.3 decides the SVC-4 replacement (mapping OPEN-5, option A).
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.registryFetchIntervalSeconds=5
# Register the pod IP (replaces spring.cloud.services.registrationMethod=direct, mapping CHG-6 option A).
eureka.instance.prefer-ip-address=true

# Actuator: /actuator/health for the probes, /actuator/prometheus for scraping. Boot 2.0 has no liveness/readiness
# groups, so both probes use /actuator/health with initial delays (deploy/kubernetes/README.md).
# data-initializer must stay exposed: the in-cluster seed Job POSTs /actuator/data-initializer (mapping CHG-12).
management.endpoints.web.exposure.include=health,info,prometheus,data-initializer
management.metrics.tags.application=${spring.application.name}
