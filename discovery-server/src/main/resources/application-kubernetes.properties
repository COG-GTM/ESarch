# Kubernetes / GKE profile (SPRING_PROFILES_ACTIVE=kubernetes): a single standalone Eureka server that replaces the TAS
# Service Registry (p-service-registry) for Axon command routing. See deploy/helm/axon-trader (discovery-server subchart) and
# docs/migration/tas-gke-mapping.md (APP-4, OPEN-5).

# Standalone: no peers to register with or replicate from.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.wait-time-in-ms-when-sync-empty=0

# Axon's consistent-hash ring is built from this registry, so a crashed pod must leave it quickly. Self-preservation
# would keep expired leases when several pods stop renewing at once (a node drain), and the read-only response cache
# would serve a stale registry for up to 30 s.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.use-read-only-response-cache=false

management.endpoints.web.exposure.include=health,info
