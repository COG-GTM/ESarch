# Server block for nginxinc/nginx-unprivileged (installed as /etc/nginx/conf.d/default.conf).
# Replaces the TAS staticfile_buildpack: `pushstate: enabled` becomes the try_files fallback below, and
# `directory: visible` is dropped on purpose (no autoindex). The API is not served here: the Ingress (or a local
# reverse proxy) routes /api/ to trader-app on the same host.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # An /api call that reaches the UI was not routed to trader-app; fail loudly instead of answering with index.html.
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":"/api is routed to trader-app by the Ingress or reverse proxy, not by the UI"}\n';
    }

    # Content-hashed bundles from `npm run build`.
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Runtime config (may be replaced by a mounted file), the service worker and the SPA shell must never be cached.
    location ~ ^/(config\.js|service-worker\.js|index\.html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback for client-side routes such as /dashboard or /orderbooks/<id>.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
