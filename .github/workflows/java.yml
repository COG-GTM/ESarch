name: java

on:
  pull_request:
    paths-ignore:
      - "infra/**"
      - "trader-app-ui/**"
      - "**/*.md"
  push:
    branches: [master]
    paths-ignore:
      - "infra/**"
      - "trader-app-ui/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Unit tests (Java 8)
        run: mvn -B test

  kubernetes-profile:
    # Both apps on SPRING_PROFILES_ACTIVE=kubernetes against docker-compose.yml with only env vars, Flyway + validate,
    # health/Prometheus, and orders/portfolios unchanged across a restart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build jars
        run: mvn -B -DskipTests package
      - name: verify-kubernetes-profile.sh
        run: ESARCH_RESET=1 ci/local/verify-kubernetes-profile.sh
      - name: App logs
        if: always()
        run: tail -n 200 target/verify-kubernetes/*.log || true
      - name: Stop compose
        if: always()
        run: docker compose down -v
