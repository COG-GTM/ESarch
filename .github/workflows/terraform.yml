name: terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: fmt, validate, tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: infra/terraform/scripts/validate.sh

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize, helm, kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz -C "$HOME/bin"
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz --strip-components=1 -C "$HOME/bin" linux-amd64/helm
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: kustomize build + kubeconform
        run: infra/k8s/scripts/validate.sh
