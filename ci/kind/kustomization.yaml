# kind stand-ins for the backing services the axon-trader Helm chart expects (ci/kind/setup.sh): MySQL 5.7 for Cloud
# SQL and RabbitMQ 3.7 for the RabbitMQ operator cluster. The apps themselves come from deploy/helm/axon-trader with
# ci/kind/values-kind.yaml. The Secrets (random passwords) are created by the script, never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: axon-trader
resources:
  - backing-services.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mysql-initdb
    literals:
      - |
        01-databases.sh=#!/bin/bash
        # Same as docker/mysql/initdb/01-databases.sh: one schema per app.
        set -e
        mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<SQL
        CREATE DATABASE IF NOT EXISTS enginedb;
        CREATE DATABASE IF NOT EXISTS appdb;
        GRANT ALL PRIVILEGES ON enginedb.* TO '${MYSQL_USER}'@'%';
        GRANT ALL PRIVILEGES ON appdb.* TO '${MYSQL_USER}'@'%';
        FLUSH PRIVILEGES;
        SQL
