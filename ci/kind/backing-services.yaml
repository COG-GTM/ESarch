# MySQL 5.7 and RabbitMQ 3.7 (the versions in docker-compose.yml), ephemeral storage. Kind only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: {app.kubernetes.io/name: mysql}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mysql}
    spec:
      # Pod Security Standard `restricted` (setup.sh labels the kind namespace enforce=restricted, as on GKE).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_USER
              value: trader
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: backing-credentials, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: backing-credentials, key: MYSQL_PASSWORD}}
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e 'select 1' enginedb"]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: data, mountPath: /var/lib/mysql}
      volumes:
        - name: initdb
          configMap: {name: mysql-initdb}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app.kubernetes.io/name: mysql}
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq}
    spec:
      # Pod Security Standard `restricted` (setup.sh labels the kind namespace enforce=restricted, as on GKE).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.7-management
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: axon-trader
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: backing-credentials, key: RABBITMQ_PASSWORD}}
          ports:
            - containerPort: 5672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - port: 5672
---
# values-kind.yaml turns on the namespace default-deny-ingress, as the GKE platform has: the stand-ins accept only
# the two Axon apps (the RabbitMQ operator component and Cloud SQL's private range play this part on GKE).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backing-services-from-axon-apps
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [mysql, rabbitmq]}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [trader-app, trading-engine]}
      ports:
        - {port: 3306, protocol: TCP}
        - {port: 5672, protocol: TCP}
