# MySQL 5.7 and RabbitMQ 3.7 (the versions in docker-compose.yml), ephemeral storage. Kind only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: {app.kubernetes.io/name: mysql}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_USER
              value: trader
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: backing-credentials, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: backing-credentials, key: MYSQL_PASSWORD}}
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e 'select 1' enginedb"]
            periodSeconds: 5
          volumeMounts:
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: initdb
          configMap: {name: mysql-initdb}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app.kubernetes.io/name: mysql}
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.7-management
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: axon-trader
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: backing-credentials, key: RABBITMQ_PASSWORD}}
          ports:
            - containerPort: 5672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - port: 5672
